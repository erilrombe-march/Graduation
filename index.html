<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Wisuda, Sayang 🎓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--night:#0f1235;--plum:#3a1d4d;--wine:#6b2145;--rose:#f2a7b8;--gold:#f1d4a0;--cream:#fff6e8;
--script:'Great Vibes',cursive;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--serif);color:var(--cream);font-size:1.25rem;line-height:1.75;min-height:100vh;overflow-x:hidden;
background:radial-gradient(ellipse at 20% 0%,#2b2670 0%,transparent 55%),radial-gradient(ellipse at 90% 60%,#7a2a57 0%,transparent 55%),
linear-gradient(180deg,var(--night),#241449 50%,var(--wine)) fixed}
body.locked{overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);animation:tw 4s ease-in-out infinite}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes drift{to{transform:translate(40px,-60px) scale(1.15)}}
main{position:relative;z-index:1}
.gold{background:linear-gradient(100deg,#e0a96d,#fff3d6,#f1d4a0,#fff3d6,#e0a96d);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 0 18px rgba(241,212,160,.35))}
@keyframes shine{to{background-position:220% center}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* cover */
#cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;
background:radial-gradient(circle at 50% 40%,#3a2a78 0%,var(--night) 72%);transition:opacity 1.4s ease,visibility 1.4s}
#cover.hide{opacity:0;visibility:hidden}
#cover h1{font-family:var(--script);font-weight:400;font-size:clamp(2.6rem,10vw,4.8rem);margin-bottom:.3rem}
#cover p{max-width:24rem;opacity:.85;margin-bottom:2.4rem;font-style:italic}
.seal{position:relative;width:9rem;height:9rem;border:0;border-radius:50%;cursor:pointer;color:#ffd9e2;font-size:3.6rem;
background:radial-gradient(circle at 35% 30%,#ff7d9c,#c22a56 55%,#8a1238);
box-shadow:0 0 0 6px rgba(194,42,86,.25),0 0 60px rgba(255,100,140,.55),inset 0 -8px 16px rgba(0,0,0,.35);
animation:beat 1.6s ease-in-out infinite;transition:transform .8s,opacity .8s}
.seal::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(255,230,235,.45);border-radius:50%}
.seal.pop{transform:scale(2.6);opacity:0}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.07)}}
.hint{margin-top:1.4rem;font-size:1rem;opacity:.65}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 1.5rem}
.hero .cap{font-size:clamp(3.5rem,12vw,5.5rem);filter:drop-shadow(0 0 24px rgba(241,212,160,.6));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-5deg)}}
.hero small{font-style:italic;letter-spacing:.1em;color:var(--rose);font-size:1.35rem;margin-top:.8rem}
.hero h2{font-family:var(--script);font-weight:400;font-size:clamp(3.6rem,15vw,8.5rem);line-height:1.05;margin:.2rem 0 .6rem}
.hero .nama{font-size:clamp(1.8rem,6vw,2.8rem);font-style:italic;font-weight:600;color:var(--cream)}
.line{display:flex;align-items:center;gap:.8rem;margin:1.4rem 0;color:var(--gold)}
.line::before,.line::after{content:"";width:min(18vw,90px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.line::after{transform:scaleX(-1)}
.days{font-style:italic;opacity:.9;max-width:28rem}
.days b{font-family:var(--script);font-weight:400;font-size:2.4rem;color:var(--rose)}
.scroll{margin-top:2.5rem;opacity:.7;animation:bob 2.5s ease-in-out infinite;font-size:1rem}

section{max-width:920px;margin:0 auto;padding:4.5rem 1.5rem;text-align:center}
section h3{font-family:var(--script);font-weight:400;font-size:clamp(2.4rem,8vw,3.8rem);margin-bottom:.4rem}
section .sub{font-style:italic;opacity:.75;margin-bottom:2.4rem}

/* foto */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2.4rem 1.6rem}
.polaroid{position:relative;background:var(--cream);color:#4a2a3a;padding:.7rem .7rem 1rem;border-radius:3px;cursor:zoom-in;
box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(241,212,160,.5);transform:rotate(var(--r));transition:transform .4s,box-shadow .4s}
.polaroid::before{content:"";position:absolute;top:-14px;left:50%;width:84px;height:26px;transform:translateX(-50%) rotate(-3deg);
background:linear-gradient(135deg,rgba(241,212,160,.85),rgba(242,167,184,.7));box-shadow:0 2px 6px rgba(0,0,0,.25)}
.polaroid:hover{transform:rotate(0) scale(1.04);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 40px rgba(242,167,184,.45)}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e9d9cc}
.polaroid figcaption{font-family:var(--script);font-size:1.7rem;margin-top:.5rem;line-height:1.2}
.polaroid:nth-child(1){--r:-3deg}.polaroid:nth-child(2){--r:2.5deg}.polaroid:nth-child(3){--r:2deg}.polaroid:nth-child(4){--r:-2.5deg}
#lb{position:fixed;inset:0;z-index:30;background:rgba(10,8,30,.92);display:none;align-items:center;justify-content:center;padding:1.5rem;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:90vh;border:8px solid var(--cream);border-radius:3px;box-shadow:0 0 80px rgba(242,167,184,.4)}

/* surat */
.letter{position:relative;text-align:left;border-radius:20px;padding:clamp(1.8rem,6vw,3.4rem);
background:linear-gradient(160deg,rgba(255,246,232,.11),rgba(255,246,232,.04));backdrop-filter:blur(8px);
border:1px solid rgba(241,212,160,.5);box-shadow:0 0 0 6px rgba(241,212,160,.07),0 30px 80px rgba(0,0,0,.4)}
.letter::before,.letter::after{content:"❦";position:absolute;color:var(--gold);font-size:1.6rem;opacity:.8}
.letter::before{top:.6rem;left:1rem}.letter::after{bottom:.6rem;right:1rem;transform:rotate(180deg)}
.letter p{margin-bottom:1.3rem}
.letter .salam{font-family:var(--script);font-size:2.6rem;color:var(--rose);text-align:center;line-height:1.2}
.letter .ttd{text-align:right;font-style:italic;margin:2rem 0 0}
.letter .ttd b{display:block;font-family:var(--script);font-weight:400;font-size:2.8rem}

/* penutup */
.finale .heart{font-size:clamp(5rem,22vw,9rem);display:inline-block;animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(255,100,140,.8))}
.finale h3{margin-top:.6rem}
footer{text-align:center;padding:1rem 1rem 7rem;opacity:.7;font-style:italic}

#music{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:25;width:3.3rem;height:3.3rem;border-radius:50%;
border:1px solid var(--gold);cursor:pointer;background:rgba(15,18,53,.8);color:var(--gold);font-size:1.3rem;backdrop-filter:blur(6px)}
#music.on{animation:spin 6s linear infinite;box-shadow:0 0 22px rgba(241,212,160,.5)}
@keyframes spin{to{transform:rotate(360deg)}}

.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.2s ease,transform 1.2s ease;transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
@media (max-width:480px){.grid{gap:1.8rem .9rem}.polaroid figcaption{font-size:1.35rem}.polaroid::before{width:60px}}
</style>
</head>
<body class="locked">

<div id="sky" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="cover">
  <h1 class="gold">Ada yang spesial untukmu</h1>
  <button class="seal" id="openBtn" aria-label="Buka ucapan">♥</button>
  <div class="hint">ketuk untuk membuka</div>
</div>

<main>
  <header class="hero">
    <div class="cap" aria-hidden="true">🎓</div>
    <small>Happy Graduation Day</small>
    <h2 class="gold">Congratulations</h2>
    <div class="nama" id="namaPacar"></div>
    <div class="line" aria-hidden="true">♥</div>
    <p class="days" id="days"></p>
    <div class="scroll" aria-hidden="true">✦ gulir ke bawah ✦</div>
  </header>

  <section>
    <h3 class="gold reveal">Perjalananmu</h3>
    <p class="sub reveal">Setiap foto, menjadi tanda bahwa kamu telah melewati banyak hal untuk mencapai hari ini</p>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h3 class="gold reveal">Surat Kecil untukmu</h3>
    <article class="letter" id="letter"></article>
  </section>

  <section class="finale">
    <div class="heart reveal" aria-hidden="true">💖</div>
    <h3 class="gold reveal" id="penutup"></h3>
  </section>

  <footer>Ketuk di mana saja untuk menebar cinta ✨</footer>
</main>

<div id="lb" role="dialog" aria-label="Foto diperbesar"><img alt=""></div>
<button id="music" aria-label="Putar atau jeda musik" title="Musik">♪</button>
<audio id="lagu" src="lagu.mp3" loop preload="auto"></audio>

<script>
const CONFIG = {
  namaPacar: "Jamilah",
  namaKamu: "Jamal",
  tanggalJadian: "2025-04-03", 
  penutup: "Aku bangga padamu",
  foto: [
    { src: "foto1.jpeg"},
    { src: "foto2.jpeg"},
    { src: "foto3.jpeg"},
    { src: "foto4.jpeg"}
  ],
  ucapan: [
    "Selamat jamilahh atas kelulusanmu. Aku tahu betul berapa banyak malam begadang, revisi, air mata, dan lelah yang kamu lewati sampai akhirnya sampai di hari ini.",
    "Aku bangga banget sama kamu. Bukan cuma karena gelar yang tersematkan di belakang nama Eka Stevia Tandi Lolok S.T, tetapi karena kamu tidak pernah menyerah, bahkan di hari-hari yang terasa paling berat.",
    "Maaf aku tidak bisa hadir secara langsung di hari spesialmu ini, tapi aku ingin kamu tau bahwa aku selalu ada di sini menemanimu dari jauh dan selalu mendoakan yang terbaik untukmu.",
    "Terima kasih sudah membiarkan aku menjadi teman didalam perjalananmu. Apa pun yang menunggu setelah hari ini, aku akan tetap di sampingmu, merayakan setiap langkahmu.",
    "Semoga semua mimpimu satu per satu jadi nyata. Aku sayang kamu, hari ini dan seterusnya."
  ]
};
/* ============================================== */

const $ = s => document.querySelector(s);
$('#namaPacar').textContent = CONFIG.namaPacar;
$('#penutup').textContent = CONFIG.penutup;

if (CONFIG.tanggalJadian) {
  const d = Math.floor((Date.now() - new Date(CONFIG.tanggalJadian)) / 864e5);
  if (d > 0) $('#days').innerHTML = `Sudah <b>${d.toLocaleString('id-ID')}</b> hari kita berjalan bersama, dan hari ini adalah salah satu yang paling indah.`;
}

const fb = n => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#e9d9cc"/><text x="50%" y="50%" text-anchor="middle" font-family="Georgia" font-size="22" fill="#8a6a6a">Letakkan ${n}</text></svg>`);
$('#grid').innerHTML = CONFIG.foto.map((f, i) => `
  <figure class="polaroid reveal" style="--d:${i*.15}s">
    <img src="${f.src}" alt="Foto ${i+1}" loading="lazy" onerror="this.onerror=null;this.src='${fb(f.src)}'">
${f.caption ? `<figcaption>${f.caption}</figcaption>` : ''}
  </figure>`).join('');
const lb = $('#lb');
$('#grid').addEventListener('click', e => {
  const im = e.target.closest('.polaroid img'); if (!im) return;
  lb.querySelector('img').src = im.src; lb.classList.add('on'); e.stopPropagation();
});
lb.addEventListener('click', e => { lb.classList.remove('on'); e.stopPropagation(); });

$('#letter').innerHTML =
  `<p class="salam reveal">Untuk ${CONFIG.namaPacar},</p>` +
  CONFIG.ucapan.map((p, i) => `<p class="reveal" style="--d:${(i+1)*.25}s">${p}</p>`).join('') +
  `<p class="ttd reveal" style="--d:${(CONFIG.ucapan.length+1)*.25}s">Cium jauh dari kendari,<b class="gold">${CONFIG.namaKamu}</b></p>`;

const sky = $('#sky');
for (let i = 0; i < 70; i++) {
  const s = document.createElement('span'); s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;transform:scale(${.5+Math.random()*1.3})`;
  sky.appendChild(s);
}
[['#6a4bd8','28rem','-8%','5%'],['#e0527f','24rem','70%','55%']].forEach(([c, sz, l, t]) => {
  const o = document.createElement('span'); o.className = 'orb';
  o.style.cssText = `background:${c};width:${sz};height:${sz};left:${l};top:${t}`; sky.appendChild(o);
});

const cv = $('#fx'), ctx = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
let W, H, dpr, petals = [], sparks = [];
const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; };
size(); addEventListener('resize', size);
const newPetal = () => ({ x: Math.random()*W, y: -20*dpr, s: (6+Math.random()*8)*dpr, vx: (Math.random()-.5)*.7*dpr, vy: (.5+Math.random()*.9)*dpr, a: Math.random()*6.28, va: (Math.random()-.5)*.05, w: Math.random()*6.28 });
const COLS = ['#f1d4a0','#f2a7b8','#ff7d9c','#fff3d6','#ffd166'];
function burst(x, y, heart, n) {
  x *= dpr; y *= dpr;
  const col = COLS[Math.random()*COLS.length|0], col2 = COLS[Math.random()*COLS.length|0];
  for (let i = 0; i < n; i++) {
    const t = i / n * 6.2832; let vx, vy;
    if (heart) { vx = 16*Math.pow(Math.sin(t),3); vy = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); const k = (heart===2?.11:.2)*dpr; vx*=k; vy*=k; }
    else { const sp = (1+Math.random()*3.5)*dpr; vx = Math.cos(t)*sp; vy = Math.sin(t)*sp; }
    sparks.push({ x, y, vx, vy, life: 1, r: (1.5+Math.random()*1.5)*dpr, c: i%2 ? col : col2 });
  }
}
function frame() {
  ctx.clearRect(0, 0, W, H);
  if (petals.length < 26 && Math.random() < .05) petals.push(newPetal());
  petals = petals.filter(p => p.y < H + 30*dpr);
  for (const p of petals) {
    p.w += .02; p.x += p.vx + Math.sin(p.w)*.6*dpr; p.y += p.vy; p.a += p.va;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = 'rgba(242,167,184,.7)';
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s*.5, 0, 0, 6.2832); ctx.fill(); ctx.restore();
  }
  ctx.globalCompositeOperation = 'lighter';
  sparks = sparks.filter(s => s.life > 0);
  for (const s of sparks) {
    s.vy += .035*dpr; s.vx *= .985; s.x += s.vx; s.y += s.vy; s.life -= .011;
    ctx.globalAlpha = Math.max(s.life, 0); ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
if (!still) frame();
const show = () => { if (still) return; burst(innerWidth*(.2+Math.random()*.6), innerHeight*(.15+Math.random()*.3), Math.random()<.6, 80); };

addEventListener('pointerdown', e => { if (!still && !e.target.closest('button')) burst(e.clientX, e.clientY, 2, 36); });

const audio = $('#lagu'), mbtn = $('#music');
audio.addEventListener('play', () => mbtn.classList.add('on'));
audio.addEventListener('pause', () => mbtn.classList.remove('on'));
mbtn.addEventListener('click', () => audio.paused ? audio.play().catch(()=>{}) : audio.pause());

$('#openBtn').addEventListener('click', e => {
  e.currentTarget.classList.add('pop');
  audio.volume = .85; audio.play().catch(() => {});
  setTimeout(() => { $('#cover').classList.add('hide'); document.body.classList.remove('locked'); }, 500);
  [0, 500, 1000, 1700, 2500].forEach(t => setTimeout(show, 700 + t));
  setInterval(() => { if (!document.hidden) show(); }, 9000);
});

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .15 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
